<style>

}

@media (max-width:760px){.setup{grid-template-columns:1fr;grid-template-areas:"sum" "opts" "toc"}.opts{position:static}.sum{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 14px;gap:10px}.sum .big b{font-size:36px}.sum .btn.go{padding:11px 22px;margin-left:auto}.sum .big{flex:1}.sum .sumhint{order:3;flex-basis:100%}}

.setup{grid-template-areas:"sum sum" "srcs rcol"!important;grid-template-columns:minmax(0,1fr) 330px!important}

.qgrid button.cur{outline:3px solid var(--accent);outline-offset:1px}
.qlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.qlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.passage.dark{background:none;padding:4px 0 0;border-top:1px dashed var(--line);border-radius:0}

.navs{display:flex;flex-direction:column;gap:10px}
.navcard{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--fg);font:inherit;font-size:20px}

.cardbar{max-width:720px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:10px}
.btn.finish{background:var(--dont);border-color:var(--dont);color:#fff;font-size:16px;padding:11px 26px;border-radius:12px}
.backbar{max-width:720px;margin:0 auto 12px}
.modal{position:fixed;inset:0;background:rgba(10,20,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--surface);border-radius:18px;padding:22px 18px 18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;position:relative;max-height:90vh;overflow:auto}
.mx{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer}
@media (max-width:760px){.setup{display:flex!important;flex-direction:column;overflow:auto}.setup>.srcs{overflow:visible;height:auto;flex:none}.rcol{display:contents}.sum{order:1;flex:none}.srcs{order:2}.rcol .opts{order:3}.srcd{order:4}.navs{order:5}.mbox .tiles{grid-template-columns:repeat(2,1fr)!important}
  header.top{padding-block:8px 6px}.brand b{font-size:17px}.brand span{font-size:12px}.cardview .card{padding:16px}.qtext{font-size:18px}.cardview .qpanel{max-height:15vh}}
.trow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;cursor:pointer;min-width:0}

.trow .tt small{color:var(--muted);font-size:12px}

.trow.allrow .tt{font-weight:700;font-size:16px}
.trow.ch .tt{font-weight:700}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}

.les-list{display:flex;flex-direction:column;padding-left:14px;border-left:2px solid var(--line);margin-left:15px}
.les{display:flex;flex-direction:column}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 6px 6px 38px;text-align:left}
.secs{display:flex;flex-direction:column;margin-left:36px;border-left:2px dashed var(--line);padding-left:8px;margin-bottom:6px}

.go-row{width:100%;background:none;border:0;border-radius:8px;color:var(--fg);font:inherit;text-align:left;cursor:pointer;padding:8px 6px}
.go-row:hover,.chgo:hover{background:var(--sunk)}
.chgo{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:0;border-radius:8px;cursor:pointer;color:var(--fg);font:inherit;padding:10px 6px 4px;margin-top:8px}
.chgo span{font-weight:700}

.book{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:3px}
.book-t{font-family:var(--f-display);font-size:19px;font-weight:700}
.book-s,.book-a{font-size:13px;color:var(--muted)}

.passage{background:var(--sunk);border-radius:10px;padding:12px 14px}

.selbar{gap:8px;margin:8px 0 0}.selbar .btn{flex:1;padding:8px 10px;font-size:13px}
.chap summary .trow,.les .trow{cursor:pointer}
.qimg{margin:12px 0 4px;padding:0}

.qa .qimg svg{max-width:520px}
.qimg{cursor:zoom-in;position:relative}
.qimg figcaption{font-size:12px;color:var(--muted,#667);margin-top:4px}
.qimg.zoom{cursor:zoom-out;overflow-x:auto;-webkit-overflow-scrolling:touch}
.qimg.zoom svg{width:1000px;max-width:none;max-height:none}
.book-s a{color:inherit}
.passage p{margin:0;font-family:var(--f-display);font-size:15px;line-height:1.6}
.passage mark{background:var(--accent-soft);color:var(--fg);padding:1px 2px;border-radius:3px}
details.chap{border:1px solid var(--line);border-radius:12px;padding:4px 8px;background:var(--surface)}

details.chap input,.lesson input{accent-color:var(--accent)}
.lesson{align-items:center}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
.script{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}

button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}

.tree{display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px}

.subsecs{margin:2px 0 6px 34px;display:flex;flex-wrap:wrap;gap:6px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=number]{width:84px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px}
.pool{font-variant-numeric:tabular-nums}
/* card */
.progress{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-height:300px;display:flex;flex-direction:column;gap:14px;position:relative}

.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}

.qtext{font-family:var(--f-display);font-size:21px;line-height:1.4;text-wrap:pretty}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
@media (max-width:480px){.mrow{grid-template-columns:minmax(0,1fr) 80px 40px}}
.mbar{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .it{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.list .it:last-child{border-bottom:0}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap;align-self:flex-start}
.pill.u{background:var(--dont-soft);color:var(--dont)} .pill.k{background:var(--know-soft);color:var(--know)} .pill.p{background:var(--part-soft);color:var(--part)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--dont-soft);padding:10px;border-radius:10px}
/* coverage */
.cov{display:flex;flex-direction:column;gap:2px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:14px;align-items:start}
.srow:hover{background:var(--sunk)}
.srow .pg{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.srow.con{opacity:.6}
.srow .n{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--know-soft);color:var(--know);font-variant-numeric:tabular-nums}
.srow.con .n{background:var(--sunk);color:var(--muted)}
.srow.zero .n{background:var(--dont-soft);color:var(--dont)}
.sq{grid-column:2/4;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sq div::before{content:"→ ";color:var(--accent)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}

<script>
(function(){
"use strict";
/* ===== SOZLAMA: alohida (Claude'dan tashqari) ishlatilganda AI serveringiz manzili =====
   Masalan: "https://sizning-domen.uz/api/ai". Bo'sh qolsa, AI faqat Claude ichida ishlaydi.
   Server POST {prompt, json} qabul qilib, {text} qaytaradi (namuna: server.py). */
const AI_URL = window.HUQUQ_AI_URL || "";
const BANK = JSON.parse(document.getElementById("bank").textContent);
const MINI = window.MINIAPP_INFO || null;   // Telegram Mini App: kirish darajasi va yopiq savollar
const TGW = window.Telegram && window.Telegram.WebApp;
try{ if(TGW){ TGW.ready(); TGW.expand(); } }catch(e){}
const SENT = Object.fromEntries(BANK.sentences.map(s=>[s.id,s]));
const SIDX = Object.fromEntries(BANK.sentences.map((s,i)=>[s.id,i]));
const LESSONS = BANK.chapters.flatMap(c=>c.lessons);
const LMAP = Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const LIDX = {}; BANK.sentences.forEach((s,i)=>{ (LIDX[s.l]=LIDX[s.l]||[]).push(s); });
const ALLSECS = LESSONS.flatMap(l=>Object.keys(l.sections).map(k=>l.id+":"+k));
const SOURCES = BANK.sources||[{id:"DHA10",type:"darslik",title:"Davlat va huquq asoslari",chapters:BANK.chapters.map(c=>c.id)}];
const SLOTS = BANK.slots||{darslik:4,qonun:35};
const CHMAP = Object.fromEntries(BANK.chapters.map(c=>[c.id,c]));
const srcChapters = s => s.chapters.map(id=>CHMAP[id]).filter(Boolean);
const srcKeys = s => srcChapters(s).flatMap(c=>c.lessons).flatMap(l=>Object.keys(l.sections).map(k=>l.id+":"+k));
const SRC_OF_L = {}; SOURCES.forEach(s=>srcChapters(s).forEach(c=>c.lessons.forEach(l=>SRC_OF_L[l.id]=s)));
const isLaw = s => !!s && s.type==="qonun";
const srcName = s => s ? (isLaw(s) ? s.title : "“"+s.title+"”"+(s.grade?" · "+s.grade:"")) : "";
const KORA = s => isLaw(s) ? ({Kodeks:"Kodeksga ko‘ra",Nizom:"Nizomga ko‘ra",Farmon:"Farmonga ko‘ra",Konstitutsiya:"Konstitutsiyaga ko‘ra"}[s.kind]||"Qonunga ko‘ra") : "Darslikka ko‘ra";
const IMGS = BANK.images||{};
const imgHTML = q => q.img&&IMGS[q.img] ? `<figure class="qimg" title="Kattalashtirish">${IMGS[q.img]}<figcaption>${TE(/scheme/.test(q.img)?"Ilovadagi sxematik tasvir asosida (4-modda oʻlchamlari) · kattalashtirish uchun bosing":"Ilovadagi rangli tasvir asosida (4-modda) · kattalashtirish uchun bosing")}</figcaption></figure>` : "";
const lsub = l => l.sub ? l.sub : (l.pages ? l.pages+"-betlar" : "");
const unitWord = u => ({modda:"moddalar",band:"bandlar",bolim:"bo‘limlar"}[u]||"");
const shortL = id => {const l=LMAP[id]||{title:""}; return l.unit==="ilova"?"Ilova":l.title.split(". ")[0];};
const locOf = (lid,ss) => { const l=LMAP[lid]||{}; if(l.unit) return shortL(lid); const pg=[...new Set(ss.map(s=>s&&s.page).filter(Boolean))].join(", "); return shortL(lid)+", "+pg+"-bet"; };
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY=86400000, INTERVALS=[0,1,2,4,8,16,32];

/* ---------- Lotin → Kirill ---------- */
const AP="[ʻ‘'`ʼ]";
const MAP={a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з",c:"с",w:"в"};
const RX=new RegExp("o"+AP+"|g"+AP+"|sh|ch|yo(?!"+AP+")|yu|ya|ye|ts|’|[a-z]","gi");
const MON={"январ":"январь","феврал":"февраль","апрел":"апрель","июн":"июнь","июл":"июль","сентабр":"сентябрь","октабр":"октябрь","ноябр":"ноябрь","декабр":"декабрь"};
function cyr(str){
  // rim raqamlari (I, II, IV, XII ...) o‘zgarmaydi; sanalarda chiziqcha qo‘yilmaydi: 1991-yil 18-noyabr → 1991 йил 18 ноябрь
  return String(str).split(/(\b(?:https?:\/\/)?[a-z]+\.(?:uz|com|org|ru)(?:\/[^\s,;)]*)?|\b(?![IVX]\. [A-ZʻʼO‘]{3})[IVXLC]+\b(?![ʻ‘'`ʼ’]))/).map((part,i)=>i%2?part:cyr0(
    part.replace(/(\d)-(yil|yanvar|fevral|mart|aprel|may|iyun|iyul|avgust|sentabr|oktabr|noyabr|dekabr)/gi,"$1 $2")
  ).replace(/(\d )(январ|феврал|апрел|июн|июл|сентабр|октабр|ноябр|декабр)(?![а-яёўқғҳъь])/g,(m,d,w)=>d+MON[w])).join("");
}
function cyr0(str){
  let out="",last=0; RX.lastIndex=0; let m;
  while((m=RX.exec(str))){
    out+=str.slice(last,m.index); last=RX.lastIndex;
    const t=m[0], low=t.toLowerCase(), prev=str[m.index-1]||" ";
    let r;
    if(/^o./.test(low)&&low.length===2&&!/[a-z]/.test(low[1])) r="ў";
    else if(/^g./.test(low)&&low.length===2&&!/[a-z]/.test(low[1])) r="ғ";
    else if(t==="’") { r="ъ"; out+=r; continue; }
    else r={sh:"ш",ch:"ч",yo:"ё",yu:"ю",ya:"я",ye:"е",ts:"ц"}[low] || (low==="e"&&!/[a-zA-Zа-яё]/i.test(prev)?"э":MAP[low]);
    if(r===undefined){out+=t;continue;}
    const up=t[0]!==t[0].toLowerCase(), allUp=t.length>1&&/[A-Z]/.test(t[1]);
    out+= up ? (allUp||(t.length===1)? (t.length>1?r.toUpperCase():r.toUpperCase()) : r[0].toUpperCase()+r.slice(1)) : r;
  }
  return out+str.slice(last);
}
let SCRIPT="lat", LANG="uz";
const T = s => SCRIPT==="cyr" ? cyr(String(s)) : String(s);
const TE = s => esc(T(s));

/* ---------- Saqlash: shaxsiy (db) + brauzer ---------- */
const LS="huquq-ustoz-v1"; // eski natijalar saqlanib qolishi uchun kalit o‘zgarmaydi
function blank(){return {v:1,upd:0,q:{},gen:[],flags:{},hist:[],set:{}}}
let ST=blank();
try{const raw=localStorage.getItem(LS); if(raw) ST=Object.assign(blank(),JSON.parse(raw));}catch(e){}
let db=null, uid=null, dbTimer=null, syncNote="";
function save(){
  ST.upd=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}
  if(db&&uid){clearTimeout(dbTimer);dbTimer=setTimeout(()=>{
    db.doc("data/users/"+uid+"/progress").set({json:JSON.stringify(ST),upd:ST.upd}).catch(()=>{});
  },1200);}
}
let sample=null;
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{
    const [d,u,s]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
    sample=s; db=d;
    if(u) uid=await u.id();
    if(db&&uid){
      const snap=await db.doc("data/users/"+uid+"/progress").get();
      const data=snap.exists?snap.data():null;
      if(data&&data.json&&(data.upd||0)>(ST.upd||0)){ST=Object.assign(blank(),JSON.parse(data.json)); try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}}
      syncNote="Natijalar hisobingizga saqlanadi va boshqa qurilmada ham ko‘rinadi.";
    }
  }catch(e){}
  render();
})();

/* ---------- Savollar ---------- */
let _QA=null,_QM=null,_QN=-1;
function allQuestions(){ const g=ST.gen||[]; if(_QN!==g.length||!_QA){_QA=BANK.questions.concat(g); _QM=Object.fromEntries(_QA.map(q=>[q.id,q])); _QN=g.length;} return _QA; }
function qById(id){allQuestions(); return _QM[id]}
function lessonOf(q){return (SENT[q.src[0]]||{}).l}
function secOf(q){const s=SENT[q.src[0]]; return s?s.l+":"+s.sec:""}
function P(id){return ST.q[id]||(ST.q[id]={b:0,d:0,n:0,k:0,p:0,u:0,l:null})}
function peek(id){return ST.q[id]}

/* ---------- Sozlamalar ---------- */
const DEF={v:3,secs:ALLSECS.slice(),count:"all",lvl:"aralash",time:0};
let CFG=Object.assign({},DEF,ST.set||{});
if(CFG.v!==3) CFG=Object.assign({},DEF); // yangi odatiy sozlamalar: hammasi, aralash, vaqt cheklanmagan
delete CFG.mode; delete CFG.typed; delete CFG.lessons;

function poolFor(cfg){
  return allQuestions().filter(q=>{
    if(!cfg.secs.includes(secOf(q))) return false;
    if(cfg.lvl==="oddiy"&&q.lvl!=="o") return false;
    if(cfg.lvl==="murakkab"&&q.lvl!=="m") return false;
    return true;
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(cfg){
  const now=Date.now();
  let pool=poolFor(cfg).map(q=>{
    const p=peek(q.id); let r;
    if(!p||!p.n) r=2; else if(p.d<=now&&p.b<=1) r=0; else if(p.d<=now) r=1; else r=3+p.b;
    return {q,r,x:Math.random()};
  });
  pool.sort((a,b)=>a.r-b.r||a.x-b.x);
  let want=cfg.count==="all"?pool.length:Math.min(+cfg.count,pool.length);
  if(cfg.lvl==="aralash"&&cfg.count!=="all"){ // ~60% oddiy, 40% murakkab
    const o=pool.filter(z=>z.q.lvl==="o"), m=pool.filter(z=>z.q.lvl==="m");
    const nm=Math.min(m.length,Math.round(want*0.4)), no=Math.min(o.length,want-nm);
    pool=o.slice(0,no).concat(m.slice(0,want-no)); pool.sort((a,b)=>a.r-b.r||a.x-b.x);
  }
  const seen=new Set(), out=[], rest=[];
  for(const z of pool){ if(out.length>=want) break; const k=z.q.src[0]; if(seen.has(k)) rest.push(z); else {seen.add(k); out.push(z);} }
  for(const z of rest){ if(out.length>=want) break; out.push(z); }
  return out.map(z=>z.q).sort(byPos);
}
function byPos(a,b){return (SIDX[a.src[0]]-SIDX[b.src[0]])||(a.id<b.id?-1:1)}

/* ---------- Holat ---------- */
const OPENCH=new Set(), CLOSEDCH=new Set(), OPENL=new Set();
let LIST=null, RESULT=null, STYPE="darslik", OPENSRC=null;
let TAB="mashq", SES=null, timerId=null, covOpen=null, clearAsk=null, covL=null;

const SCROLLERS=[".setup>.srcs",".setup",".rcol",".scrollv",".listview","#view .card",".qpanel"];
function render(){
  const keep={}; SCROLLERS.forEach(q=>{const e=document.querySelector(q); if(e) keep[q]=e.scrollTop;});
  _render();
  if(!render.reset) SCROLLERS.forEach(q=>{const e=document.querySelector(q); if(e&&keep[q]!=null) e.scrollTop=keep[q];});
  render.reset=false;
}
function _render(){
  document.querySelectorAll("[data-t]").forEach(el=>{ if(!el.dataset.orig) el.dataset.orig=el.textContent; el.textContent=T(el.dataset.orig); });
  const v=$("#view");
  if(LANG==="ru"&&TAB==="mashq"&&!SES&&!LIST) v.innerHTML=viewRu();
  else if(TAB==="mashq") v.innerHTML = LIST ? viewList() : SES ? viewCard() : viewSetup();
  else if(TAB==="stat") v.innerHTML=`<div class="scrollv">${backBar()+viewStats()}</div>`;
  else v.innerHTML=`<div class="scrollv">${backBar()+viewCoverage()}</div>`;
  if(RESULT) v.insertAdjacentHTML("beforeend",viewResult());
  bind();
  if(TAB==="mashq"&&SES) drawRing();
}

/* ---------- 1. Sozlash ---------- */
function lvlOk(q){return CFG.lvl==="aralash"||(CFG.lvl==="oddiy"?q.lvl==="o":q.lvl==="m")}
function secCounts(){const c={}; allQuestions().forEach(q=>{ if(lvlOk(q)){const k=secOf(q); c[k]=(c[k]||0)+1;} }); return c;}
const lessonNo=l=>{const m=l.title.match(/^(\d+)(?:–(\d+))?-dars/); return m?[+m[1],+(m[2]||m[1])]:null};
function chapRange(c){const f=c.lessons[0], z=c.lessons[c.lessons.length-1];
  if(f&&f.unit){ const us=c.lessons.filter(l=>l.unit!=="ilova"); if(!us.length) return ""; const a=us[0].no, b=us[us.length-1].no; return (a===b?a:a+"–"+b)+"-"+unitWord(us[0].unit)+" ("+us.length+" ta)"; }
  const a=lessonNo(f), b=lessonNo(z); return a&&b?`${a[0]}–${b[1]}-darslar`:""}
const keysOfL=l=>Object.keys(l.sections).map(k=>l.id+":"+k);
// Blok holati: tanlangan savollar soni, jami, belgi holati
function blockState(keys,C,S){ let sel=0,tot=0,ks=0,kt=0; keys.forEach(k=>{const n=C[k]||0; if(!n) return; tot+=n; kt++; if(S.has(k)){sel+=n; ks++;}}); return {sel,tot,st:ks===0?"off":ks===kt?"on":"mix"}; }
const cntHTML=b=>b.sel?`<span class="cnt on">(${b.sel})</span>`:`<span class="cnt">(${b.tot})</span>`;
const cbHTML=(b,attr)=>`<input type="checkbox" ${attr} ${b.st==="on"?"checked":""} ${b.st==="mix"?'data-mix="1"':""}>`;
function viewSetup(){
  const C=secCounts(), S=new Set(CFG.secs);
  const all=blockState(ALLSECS,C,S);
  const nLes=LESSONS.filter(l=>keysOfL(l).some(k=>S.has(k)&&C[k])).length;
  const tocOf=src=>srcChapters(src).map(c=>{
    const cb=blockState(c.lessons.flatMap(keysOfL),C,S);
    const ls=c.lessons.map(l=>{
      const lb=blockState(keysOfL(l),C,S), open=OPENL.has(l.id);
      const secs=open?`<div class="secs">${Object.entries(l.sections).map(([k,tt])=>{const key=l.id+":"+k, sb=blockState([key],C,S); if(!sb.tot) return "";
        return `<label class="trow sec">${cbHTML(sb,`data-sec="${key}"`)}<span class="tt">${TE(tt)}</span>${cntHTML(sb)}</label>`;}).join("")}</div>`:"";
      const many=Object.keys(l.sections).length>1;
      return `<div class="les"><label class="trow">${cbHTML(lb,`data-lesson="${l.id}"`)}<span class="tt">${TE(l.title)}${lsub(l)?`<small>${TE(lsub(l))}</small>`:""}</span>${cntHTML(lb)}</label>
        ${many?`<button class="link" data-open="${l.id}">${TE(open?"Bo‘limlarni yopish":"Bo‘limlarni ochish")}</button>${secs}`:""}</div>`;
    }).join("");
    return `<details class="chap" data-ch="${c.id}" ${OPENCH.has(c.id)?"open":""}><summary><span class="trow ch">${cbHTML(cb,`data-chap="${c.id}" aria-label="${TE("Butun bobni belgilash")}"`)}<span class="tt">${TE(c.title)}<small>${TE(chapRange(c))}</small></span>${cntHTML(cb)}<span class="chev" aria-hidden="true">▾</span></span></summary><div class="les-list">${ls}</div></details>`;
  }).join("");
  const opt=(key,vals)=>vals.map(([v,l])=>`<button class="chip" data-opt="${key}" data-val="${v}" aria-pressed="${String(CFG[key])===String(v)}">${TE(l)}</button>`).join("");
  const n=all.sel, isList=CFG.view==="list", cnt=CFG.count==="all"?n:Math.min(+CFG.count,n);
  const ofType=ty=>SOURCES.filter(s=>s.type===ty);
  const qCnt=ty=>ofType(ty).reduce((a,s0)=>a+blockState(srcKeys(s0),C,S).tot,0).toLocaleString("ru-RU");
  const SC={DHA8:"#2e7d32",DHA9:"#1565c0",DHA10:"#7b1fa2",DHA11:"#c75b00"};
  const srcRow=s=>{const sb=blockState(srcKeys(s),C,S), op=OPENSRC===s.id;
    const small=isLaw(s)?(s.ready?"":TE("savollar tayyorlanmoqda")):TE(s.pub||"")+(s.authors?"<br>"+TE("Mualliflar: "+s.authors):"");
    return `<div class="srcwrap ${op?"open":""}" ${SC[s.id]?`style="--sc:${SC[s.id]}"`:""}><div class="srcrow ${op?"open":""}"><div class="trow">${cbHTML(sb,`data-src="${s.id}" aria-label="${TE("Belgilash")}"`)}<button class="tt srct" data-srcopen="${s.id}" aria-expanded="${op}"><b>${TE(srcName(s))}</b>${small?`<small>${small}</small>`:""}</button>${cntHTML(sb)}<span class="chev" aria-hidden="true">${op?"▴":"▾"}</span></div></div>${op?detailOf(s):""}</div>`;};
  const slotsHTML=ty=>{const have=ofType(ty).length, left=Math.max(0,(SLOTS[ty]||0)-have);
    if(ty==="qonun"&&!left) return "";
    if(ty==="darslik") return Array.from({length:left},(_,i)=>`<div class="slot">${TE((have+i+1)+"-darslik — tez orada qo‘shiladi")}</div>`).join("");
    return left?`<div class="slot big">${TE(left+" ta qonun — ro‘yxati va matni qo‘shilgach shu yerda paydo bo‘ladi: qonun → bob → modda bo‘yicha filtr bilan.")}</div>`:"";};
  function detailOf(OS){const sb=blockState(srcKeys(OS),C,S); return `<section class="srcd">
    ${isLaw(OS)?`<div class="plate"><div class="kick">${TE(OS.n+"-hujjat · "+OS.kind)}</div>
      <div class="book-t">${TE(srcName(OS))}</div>
      <div class="book-s">${TE("Manba: ")}<a href="https://${OS.pub}" target="_blank" rel="noopener">${esc(OS.pub)}</a></div>
</div>
    <div class="lbl" style="margin-top:14px">${TE("Mundarija — "+(OS.chapters.length&&srcChapters(OS)[0].lessons[0].unit==="band"?"bandlarni":"moddalarni")+" belgilang")}</div>
    <label class="trow allrow">${cbHTML(sb,`data-src="${OS.id}"`)}<span class="tt">${TE("Butun hujjat moddalaridan savol-javob")}</span>${cntHTML(sb)}</label>`
    :`<div class="plate"><div class="kick">${TE("Darslik")}</div>
      <div class="book-t">${TE(srcName(OS))}</div>
      ${OS.sub?`<div class="book-s">${TE(OS.sub+(OS.pub?" · "+OS.pub:""))}</div>`:""}
      ${OS.authors?`<div class="book-a"><span>${TE("Mualliflar:")}</span> ${TE(OS.authors)}</div>`:""}
      <div class="plate-note">${TE("Savollar ushbu darslikni yaxshi o‘zlashtirish uchun faqat shu darslik matnidan foydalanib tuzilgan. Har bir javob va tushuntirish darslikka ko‘ra beriladi.")}</div></div>
    <div class="lbl" style="margin-top:14px">${TE("Mundarija — mavzularni belgilang")}</div>

// “Tushunmadim” — darslikdagi parcha: manba gaplar va ularning atrofidagi gaplar (o‘sha bo‘lim ichida)
const HSTOP=new Set("va bilan uchun ham yoki bu shu qaysi qanday nima necha qancha kim kimlar qayerda qachon nechta qilib boʻlib boʻladi hisoblanadi etib deb esa emas mumkin ushbu mazkur oʻzbekiston respublikasi respublikasining respublikasida davlat qonun qonunga koʻra boʻyicha".split(" "));
const normW=w=>w.toLowerCase().replace(/[ʻ‘'`ʼ’]/g,"ʻ");
const stem=w=>{w=normW(w); return /^\d/.test(w)?w.replace(/[^\d,./]/g,""):w.slice(0,Math.max(4,Math.min(w.length,6)));};
function hiText(text,ans,qq,isSrc){
  const tok=t=>(t.match(/[\p{L}ʻ‘'`ʼ’]+|\d+(?:[.,/]\d+)*/gu)||[]).map(normW).filter(w=>(w.length>2||/^\d/.test(w))&&!HSTOP.has(w)).map(stem);
  const A=new Set(tok(ans)), Q=new Set(tok(qq));
  return text.split(/(\p{L}[\p{L}ʻ‘'`ʼ’\-]*|\d+(?:[.,/]\d+)*)/u).map((part,k)=>{
    if(k%2===0) return TE(part);
    const w=normW(part); if(HSTOP.has(w)||(w.length<3&&!/^\d/.test(w))) return TE(part);
    const st=stem(part);
    if(isSrc&&A.has(st)) return `<span class="hw">${TE(part)}</span>`;
    if(Q.has(st)) return `<span class="hy">${TE(part)}</span>`;
    return TE(part);
  }).join("");
}
// “Tushunmadim” — faqat javob joylashgan norma abzatsi (darslikda — javob gaplari)
function passageHTML(q){
  const lid=lessonOf(q), L=LIDX[lid]||[], law=!!(LMAP[lid]||{}).unit, S0=SRC_OF_L[lid];

  let part=L.filter(s=>set.has(s.id));
  if(law){ const pars=new Set(part.map(s=>s.p)); part=L.filter(s=>pars.has(s.p)&&s.l===lid); }
  if(!part.length) return "";
  const pages=[...new Set(part.map(s=>s.page).filter(Boolean))].join(", ");
  return `<div class="passage dark"><div class="lbl" style="margin:0 0 8px"><b>${TE(KORA(S0))}</b> · ${TE(srcName(S0)+", "+shortL(lid)+(law?"":", "+pages+"-bet"))}</div>
    ${part.map(s=>`<p class="lp">${hiText(s.text,q.a,q.q,set.has(s.id))}</p>`).join("")}
    </div>`;
}

function grade(g){
  const q=cur(), p=P(q.id), now=Date.now();
  p.n++; p[g]++; p.l=g; p.t=now;
  if(g==="u"){p.b=0;p.d=now;}
  else if(g==="p"){p.b=Math.max(1,p.b-1);p.d=now+DAY;}
  else {p.b=Math.min(6,p.b+1);p.d=now+INTERVALS[p.b]*DAY;}
  SES.list[SES.i].g=g; recount(); save();
  // keyingi belgilanmagan savolga; hammasi belgilangan bo‘lsa — yakun
  const L=SES.list, n=L.length;
  for(let k=1;k<=n;k++){ const j=(SES.i+k)%n; if(!L[j].g){ return goTo(j); } }
  finishSession();

function siblings(q){ const set=new Set(q.src), pos=Object.fromEntries(SES.list.map((x,i)=>[x.id,i]));

    .sort((a,b)=>(a.j===undefined)-(b.j===undefined)||(a.j-b.j)||byPos(a.o,b.o)); }

function srcText(q){return q.src.map(id=>SENT[id]&&("["+id+", "+SENT[id].page+"-bet] "+SENT[id].text)).join("\n")}
const RULES="Sen abituriyentlarni “Davlat va huquq asoslari” darsliklari (8, 9, 10, 11-sinflar) bo‘yicha tayyorlovchi ustozsan. QAT’IY QOIDA: savol, javob, misol va tushuntirish FAQAT quyida berilgan darslik matnidan olinadi. O‘zingdan fakt, modda raqami, sana, ism, vaziyat, o‘xshatish yoki tashqi bilim qo‘shma; misol kerak bo‘lsa faqat darslikning o‘z misolini keltir. Matnda javob bo‘lmasa “Bu darslikda yoritilmagan” de. O‘zbek tilida, lotin yozuvida yoz. Qisqa va o‘rgatuvchi bo‘l.";
function validQ(o){return o&&typeof o.savol==="string"&&typeof o.javob==="string"&&o.savol.length>5&&o.javob.length>0}
/* AI adapter: Claude ichida — sample; alohida HTML — o'z serveringiz (AI_URL) */
let aiCtl=null;
function parseJSON(t){const m=String(t).match(/[\[{][\s\S]*[\]}]/); if(!m) throw {code:"bad"}; try{return JSON.parse(m[0])}catch(e){throw {code:"bad"}}}
async function aiText(prompt,onText,json){
  aiCtl=new AbortController(); const ctl=aiCtl;
  const to=setTimeout(()=>{ctl.abort(); ctl.timedOut=true;},90000);
  try{
    if(sample){
      if(json) return await sample.json(prompt,{modelTier:"quick",signal:ctl.signal});
      const r=await sample(prompt,{modelTier:"quick",signal:ctl.signal,onText:onText?({text})=>onText(text):undefined}); return r.text;
    }
    if(AI_URL){
      const res=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,json:!!json}),signal:ctl.signal});
      if(res.status===429) throw {code:"rate_limited"};
      if(!res.ok) throw {code:"server"};
      const d=await res.json(); if(onText) onText(d.text||"");
      return json?parseJSON(d.text):d.text;
    }
    throw {code:"no_ai"};
  }catch(e){ if(ctl.timedOut) throw {code:"timeout"}; if(ctl.signal.aborted) throw {code:"cancelled"}; throw e; }
  finally{clearTimeout(to); if(aiCtl===ctl) aiCtl=null;}
}
const aiJSON=p=>aiText(p,null,true);
const AIOK=()=>!!(sample||AI_URL);
/* Tokensiz javob tekshirish: kalit so'zlar va raqamlar bo'yicha */
const STOP=new Set("va bilan uchun bu shu ham esa yoki deb bolgan boladi emas qilib hamda kabi har bir ular uning ning dan lekin ammo yani ekan degan qilish mumkin".split(" "));
function toks(s){return String(s).toLowerCase().replace(/[ʻ‘'`ʼ’]/g,"").replace(/[^a-z0-9а-яёўқғҳ\s-]/gi," ").split(/[\s-]+/).filter(Boolean)}
function localGrade(typed,answer){
  const tt=toks(typed), keys=[...new Set(toks(answer).filter(w=>/^\d+$/.test(w)||(w.length>=3&&!STOP.has(w))))];
  if(!keys.length||!tt.length) return {g:"u",hit:0,tot:keys.length,miss:keys};
  const has=k=>/^\d+$/.test(k)?tt.includes(k):tt.some(w=>w.slice(0,Math.min(5,k.length))===k.slice(0,Math.min(5,k.length))&&!(w.startsWith("no")&&!k.startsWith("no")));
  const miss=keys.filter(k=>!has(k)), hit=keys.length-miss.length, r=hit/keys.length;
  const numBad=keys.some(k=>/^\d+$/.test(k)&&!tt.includes(k));
  return {g:numBad?(r>=0.5?"p":"u"):(r>=0.75?"k":r>=0.4?"p":"u"),hit,tot:keys.length,miss};
}
async function ai(kind){
  const q=cur();
  // 1) Tayyor tushuntirish — tokensiz
  // Tushuntirish — faqat darslik matni (AI ishlatilmaydi)
  if(kind==="explain"){SES.passage=true;render();try{const d=$(".passage.dark"); if(d) d.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(e){} return;}
  // 2) Shu faktdan bankdagi boshqa savol — tokensiz
  if(kind==="variant"){
    const used=new Set(SES.list.map(x=>x.id));
    const sib=shuffle(allQuestions().filter(o=>!used.has(o.id)&&o.src.some(s=>q.src.includes(s))));
    if(sib.length){SES.list.splice(SES.i+1,0,{id:sib[0].id,rep:0}); SES.ai="Shu faktga oid bankdagi boshqa savol keyingi karta bo‘ladi."+(sib.length>1?" Yana "+(sib.length-1)+" ta variant bor.":""); SES.aiErr=false; render(); return;}
    if(!AIOK()){SES.ai="Bu fakt bo‘yicha bankdagi barcha savollar shu sessiyada bor. Yangi variant tuzish uchun AI ulanishi kerak."; render(); return;}
  }
  // 3) Yozma javobni kod bilan taxminiy tekshirish — tokensiz
  if(kind==="grade"){
    const r=localGrade(SES.typed,q.a); SES.sug=r.g; SES.graded=true; SES.aiErr=false;
    SES.ai=`Taxminiy tekshiruv: ${r.hit}/${r.tot} kalit so‘z topildi.`+(r.miss.length?` Yetishmayotgan: ${r.miss.join(", ")}.`:"")+" Taklif qilingan baho belgilandi, yakuniy bahoni o‘zingiz tanlang.";
    render(); return;
  }
  if(kind==="gradeAI") kind="grade";
  if(!AIOK()) return;
  SES.ai="O‘ylayapman… (birinchi marta Claude ruxsat so‘rashi mumkin — oynani tasdiqlang)"; SES.aiErr=false; SES.aiBusy=true; render();
  try{
    if(kind==="explain"){
      await aiText(`${RULES}\n\nDarslik matni:\n${srcText(q)}\n\nSavol: ${q.q}\nTo‘g‘ri javob: ${q.a}\n\nAbituriyent buni tushunmadi. 3–4 gapda darslik so‘zlariga yaqin, sodda tushuntir; darslikda shu mavzuga misol bo‘lsa, faqat o‘shani keltir; oxirida darslik atamalaridan “Eslab qoling: …” kalitini ber. Sarlavha va markdown ishlatma.`,
        text=>{SES.ai=text; const b=$(".aibox"); if(b) b.textContent=T(text);});
    } else if(kind==="variant"){
      const o=await aiJSON(`${RULES}\n\nDarslik matni:\n${srcText(q)}\n\nShu matndagi faktdan mavjud savoldan BOSHQA shakldagi bitta yangi savol tuz (masalan teskari savol, to‘g‘ri/noto‘g‘ri, bo‘sh joy, darslikdagi misol bo‘yicha savol). Savol, javob va izohdagi har bir so‘z matndan kelib chiqsin. Mavjud savol: “${q.q}”.\nFaqat JSON qaytar: {"savol":"...","javob":"1 jumla","izoh":"1 jumla yoki bo‘sh","daraja":"o yoki m","turi":"qisqa nom"}`);
      if(!validQ(o)) throw {code:"bad"};
      const nq=addGen(o,q.src);
      SES.list.splice(SES.i+1,0,{id:nq.id,rep:0});
      SES.ai="Yangi savol qo‘shildi — keyingi karta shu bo‘ladi. U bankingizga ham saqlandi.";
    } else if(kind==="grade"){
      const o=await aiJSON(`${RULES}\n\nDarslik matni:\n${srcText(q)}\n\nSavol: ${q.q}\nTo‘g‘ri javob: ${q.a}\nAbituriyent javobi: ${SES.typed}\n\nAbituriyent javobini mazmunan baholа (so‘zma-so‘z emas). Faqat JSON qaytar: {"baho":"k|p|u","izoh":"1–2 jumla: nimasi to‘g‘ri, nimasi yetishmaydi"}  (k = to‘g‘ri, p = qisman, u = noto‘g‘ri)`);
      if(!o||!["k","p","u"].includes(o.baho)) throw {code:"bad"};
      SES.sug=o.baho; SES.ai=({k:"To‘g‘ri. ",p:"Qisman to‘g‘ri. ",u:"Noto‘g‘ri. "})[o.baho]+(o.izoh||"");
    }
  }catch(e){ if(e&&e.code==="cancelled"&&e.text){SES.ai=e.text;} else {SES.aiErr=true; SES.ai=aiErrText(e);} }
  SES.aiBusy=false; render();
}
function aiErrText(e){
  const c=e&&e.code;
  if(c==="cancelled") return "To‘xtatildi.";
  if(c==="timeout") return "AI 90 soniyada javob bermadi. Internetni tekshirib, qayta bosing.";
  if(c==="no_ai") return "AI ulanmagan: sahifa Claude ichida ochilmagan va AI server manzili (AI_URL) ko‘rsatilmagan.";
  if(c==="server") return "AI serveri xato qaytardi. Server ishlayotganini tekshiring.";
  if(c==="not_granted") return "AI ruxsati berilmadi. Ruxsat bersangiz, AI funksiyalari ishlaydi.";
  if(c==="rate_limited") return "Juda ko‘p so‘rov yuborildi. Bir daqiqadan keyin qayta urinib ko‘ring.";
  if(c==="bad") return "AI javobi kutilgan shaklda kelmadi. Qayta bosib ko‘ring.";
  return "AI bilan bog‘lanib bo‘lmadi. Birozdan keyin qayta urinib ko‘ring.";
}
function addGen(o,src){
  const nq={id:"AI-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),src,lvl:o.daraja==="m"?"m":"o",type:(o.turi||"AI savol").slice(0,30),q:o.savol,a:o.javob,w:o.izoh||"",ai:true};
  ST.gen=(ST.gen||[]).concat(nq); save(); return nq;
}
/* ---------- 3. Statistika ---------- */
function viewStats(){
  const qs=allQuestions(); let k=0,p=0,u=0,seen=0,due=0; const now=Date.now();
  qs.forEach(q=>{const s=peek(q.id); if(s&&s.n){seen++;k+=s.k;p+=s.p;u+=s.u; if(s.d<=now) due++;}});
  const tot=k+p+u;
  const byL={}; qs.forEach(q=>{(byL[lessonOf(q)]=byL[lessonOf(q)]||[]).push(q)});
  const row=(title,list,go)=>{ let kk=0,pp=0,uu=0; list.forEach(q=>{const s=peek(q.id); if(s&&s.l){ if(s.l==="k")kk++; else if(s.l==="p")pp++; else uu++; }});
    const n=list.length||1, m=Math.round(list.reduce((a,q)=>a+Math.min((peek(q.id)||{b:0}).b,5),0)/(n*5)*100);
    return `<button class="mrow go-row" data-go="${go}" title="${TE("Shu mavzudan savol-javob")}"><span>${TE(title)} <span class="hint">(${list.length})</span></span>
      <span class="mbar" title="bildim/qisman/bilmadim"><i style="width:${kk/n*100}%;background:var(--know)"></i><i style="width:${pp/n*100}%;background:var(--part)"></i><i style="width:${uu/n*100}%;background:var(--dont)"></i></span>
      <span class="num">${m}% ›</span></button>`; };
  const hasQ=c=>c.lessons.some(l=>(byL[l.id]||[]).length);
  const secRows=SOURCES.filter(S0=>srcChapters(S0).some(hasQ)).map(S0=>`<div class="srch">${TE(srcName(S0))}</div>`+srcChapters(S0).filter(hasQ).map(c=>`<button class="chgo" data-go="${c.id}"><span>${TE(c.title)}</span><small>${TE(chapRange(c)+" · butun "+(isLaw(S0)?"bo‘limdan":"bobdan")+" savol-javob ›")}</small></button>`+c.lessons.filter(l=>!isLaw(S0)||(byL[l.id]||[]).length).map(l=>row(l.title,byL[l.id]||[],l.id)).join("")).join("")).join("");
  const weak=qs.filter(q=>(peek(q.id)||{}).u).sort((a,b)=>peek(b.id).u-peek(a.id).u).slice(0,8);
  const hist=(ST.hist||[]).slice(0,8);
  const d=t=>new Date(t).toLocaleDateString("uz-UZ",{day:"2-digit",month:"2-digit"})+" "+new Date(t).toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});
  return `<div class="stack"><h2 class="sech" style="margin:0">${TE("O‘zlashtirish statistikasi")}</h2>
    <div class="tiles">
      <div class="tile"><b>${seen}/${qs.length}</b><span>${TE("ko‘rilgan savollar")}</span></div>
      <div class="tile"><b style="color:var(--know)">${tot?Math.round(k/tot*100):0}%</b><span>${TE("bildim ulushi")}</span></div>
      <div class="tile"><b style="color:var(--dont)">${u}</b><span>${TE("jami “bilmadim”")}</span></div>
      <div class="tile"><b>${due}</b><span>${TE("takrorga navbatda")}</span></div>
    </div>
    <section class="panel"><h3>${TE("Mavzular bo‘yicha o‘zlashtirish")}</h3>
      <p class="hint" style="margin:0 0 6px">${TE("Mavzuni bosing — darhol shu mavzudan savol-javob boshlanadi. Chiziq: yashil — bildim, sariq — qisman, qizil — bilmadim.")}</p>${secRows}</section>
    <section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">${TE("Eng ko‘p qiynagan savollar")}</h3>
      ${weak.length?`<button class="btn" id="drillWeak" style="padding:6px 12px">${TE("Shularni mashq qilish")}</button>`:""}</div>
      ${weak.length?`<div class="list">${weak.map(q=>`<div class="it"><span>${TE(q.q)}</span><span class="pill u">✗ ${peek(q.id).u}</span></div>`).join("")}</div>`:`<div class="empty">${TE("Hali “bilmadim” deb belgilangan savol yo‘q.")}</div>`}</section>
    <section class="panel"><h3>${TE("Sessiyalar tarixi")}</h3>
      ${hist.length?`<div class="list">${hist.map(h=>`<div class="it"><span class="pool">${d(h.t)} · ${h.n} ${TE("savol")}</span><span><span class="pill k">✓ ${h.k}</span> <span class="pill p">≈ ${h.p}</span> <span class="pill u">✗ ${h.u}</span></span></div>`).join("")}</div>`:`<div class="empty">${TE("Birinchi sessiyani “Mashq” bo‘limida boshlang.")}</div>`}</section>
    <section class="panel"><h3>${TE("Statistikani tozalash")}</h3>
      ${clearAsk?`<div class="confirm"><span>${TE(clearAsk==="all"?"Barcha natijalar, AI savollari va tarix o‘chadi. Rostdan ham?":"Mundarijada belgilangan mavzular natijalari o‘chadi. Rostdan ham?")}</span>
        <button class="btn" id="clrYes" style="border-color:var(--dont);color:var(--dont)">${TE("Ha, tozalash")}</button><button class="btn ghost" id="clrNo">${TE("Bekor qilish")}</button></div>`
      :`<div class="row"><button class="btn" data-clr="lesson">${TE("Belgilangan mavzular natijalarini")}</button><button class="btn" data-clr="all">${TE("Hammasini")}</button></div>`}
      ${syncNote?`<p class="hint" style="margin:8px 0 0">${TE(syncNote)}</p>`:`<p class="hint" style="margin:8px 0 0">${TE("Natijalar shu brauzerda saqlanadi.")}</p>`}
    </section></div>`;
}

/* ---------- 4. Qamrov ---------- */
function viewCoverage(){
  const qs=allQuestions(), COV={}; qs.forEach(q=>q.src.forEach(id=>COV[id]=(COV[id]||0)+1));
  const isF=s=>s.kind==="fakt"||s.kind==="darslik_savoli";
  const facts=BANK.sentences.filter(isF), covered=facts.filter(s=>COV[s.id]).length;
  const con=BANK.sentences.length-facts.length;
  const cl=covL&&LMAP[covL]?covL:LESSONS[0].id, L=LMAP[cl], S=LIDX[cl]||[];
  const lf=S.filter(isF), lc=lf.filter(s=>COV[s.id]).length;
  const groups=Object.entries(L.sections).map(([k,tt])=>{
    const rows=S.filter(s=>s.sec===k).map(s=>{
      const c=COV[s.id]||0, open=covOpen===s.id, f=isF(s);
      const cls=!f?"con":(c?"":"zero");
      return `<div class="srow ${cls}" data-s="${s.id}" role="button" tabindex="0" aria-expanded="${open}"><span class="pg">${s.page?s.id.split("-")[1]+"<br>"+s.page+"-b":s.id.split("-").slice(1,-1).join("-")}</span><span>${TE(s.text)}</span><span class="n">${!f?TE(s.kind==="xizmat"?"xizmat":s.kind==="mashq"?"mashq":"bog‘lovchi"):c+" "+TE("savol")}</span>
        ${open?`<div class="sq">${!f?`<span>${TE("Fakt yo‘q: ritorik, o‘tish yoki xizmat matni.")}</span>`:qs.filter(q=>q.src.includes(s.id)).map(q=>`<div>${TE(q.q)}${q.ai?" <b>[AI]</b>":""}</div>`).join("")}</div>`:""}</div>`;
    }).join("");
    return rows?`<section class="panel"><h3>${TE(tt)}</h3><div class="cov">${rows}</div></section>`:"";
  }).join("");
  return `<div class="stack">
    <div class="tiles">
      <div class="tile"><b>${SOURCES.filter(x=>!isLaw(x)).length}+${SOURCES.filter(isLaw).length}</b><span>${TE("darslik + hujjat")}</span></div>
      <div class="tile"><b>${BANK.sentences.length}</b><span>${TE("gap (savol tuzilgan manbalarda)")}</span></div>
      <div class="tile"><b style="color:var(--know)">${covered}/${facts.length}</b><span>${TE("faktli gap qamrovda")}</span></div>
      <div class="tile"><b>${qs.length}</b><span>${TE("savol")}</span></div>
    </div>
    <section class="panel row" style="justify-content:space-between">
      <label class="row" style="gap:8px;min-width:0;flex:1"><span class="lbl" style="margin:0">${TE("Dars")}</span>
        <select id="covSel" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit">${BANK.chapters.filter(c=>c.lessons.some(l=>LIDX[l.id])).map(c=>{const S0=SRC_OF_L[c.lessons[0].id]||{}; return `<optgroup label="${TE((isLaw(S0)?S0.n+"-hujjat":S0.grade||"")+" · "+c.title)}">${c.lessons.filter(l=>LIDX[l.id]).map(l=>`<option value="${l.id}" ${l.id===cl?"selected":""}>${TE(l.title)}</option>`).join("")}</optgroup>`}).join("")}</select></label>
      <span class="hint pool">${TE(srcName(SRC_OF_L[cl])+" · bu darsda: "+S.length+" gap, "+lc+"/"+lf.length+" faktli gap qamrovda")}</span>
    </section>
    <p class="note">${TE("Har bir gapni bosing — unga bog‘langan savollar ochiladi. Qizil belgi qamrovdan tushib qolgan gapni bildiradi; hozir bunday gap yo‘q.")}</p>
    ${groups}</div>`;
}

  on("[data-nav]",e=>{const v=e.currentTarget.dataset.nav; if(v!=="mashq"&&SES&&!RESULT){} if(RESULT&&v==="stat"){RESULT=null; SES=null; clearInterval(timerId);} TAB=v; render(); try{window.scrollTo(0,0)}catch(e){}});
  on("[data-stype]",e=>{STYPE=e.currentTarget.dataset.stype; render();});
  on("[data-srcopen]",e=>{const id=e.currentTarget.dataset.srcopen; OPENSRC=OPENSRC===id?null:id; render();});
  on("[data-src]",e=>{const s=SOURCES.find(x=>x.id===e.target.dataset.src); setKeys(srcKeys(s),e.target.checked);},"change");
  on("#aiStop",()=>{if(aiCtl) aiCtl.abort();});
  on("#drillWeak",()=>{const qs=allQuestions().filter(q=>(peek(q.id)||{}).u).sort((a,b)=>peek(b.id).u-peek(a.id).u).slice(0,8); TAB="mashq"; startSession(qs);});
  on("[data-clr]",e=>{clearAsk=e.currentTarget.dataset.clr; render();});
  on("#clrNo",()=>{clearAsk=null;render();});
  on("#clrYes",()=>{
    if(clearAsk==="all"){const set=ST.set; ST=blank(); ST.set=set;}
    else{const S=new Set(CFG.secs); allQuestions().filter(q=>S.has(secOf(q))).forEach(q=>delete ST.q[q.id]);}
    clearAsk=null; save(); render();
  });
  on("[data-s]",e=>{const id=e.currentTarget.dataset.s; covOpen=covOpen===id?null:id; render();});
  on("[data-s]",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault(); e.currentTarget.click();}},"keydown");
}
const setLang=l=>{LANG=l;$("#lnUz").setAttribute("aria-pressed",String(l==="uz"));$("#lnRu").setAttribute("aria-pressed",String(l==="ru"));document.documentElement.lang=l==="ru"?"ru":"uz";$("#scLat").parentNode.style.display=l==="ru"?"none":"";SES=null;LIST=null;TAB="mashq";clearInterval(timerId);render();};
$("#lnUz").onclick=()=>setLang("uz"); $("#lnRu").onclick=()=>setLang("ru");
$("#scLat").onclick=()=>{SCRIPT="lat";$("#scLat").setAttribute("aria-pressed","true");$("#scCyr").setAttribute("aria-pressed","false");try{localStorage.setItem(LS+"-sc","lat")}catch(e){} render();};
$("#scCyr").onclick=()=>{SCRIPT="cyr";$("#scCyr").setAttribute("aria-pressed","true");$("#scLat").setAttribute("aria-pressed","false");try{localStorage.setItem(LS+"-sc","cyr")}catch(e){} render();};
try{if(localStorage.getItem(LS+"-sc")==="cyr"){SCRIPT="cyr";$("#scCyr").setAttribute("aria-pressed","true");$("#scLat").setAttribute("aria-pressed","false");}}catch(e){}
document.addEventListener("keydown",e=>{
  if(TAB!=="mashq"||!SES||RESULT||e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(!SES.revealed&&(e.key===" "||e.key==="Enter")){e.preventDefault();reveal();}
  else if(SES.revealed&&["1","2","3"].includes(e.key)) grade({1:"u",2:"p",3:"k"}[e.key]);
  else if(e.key==="ArrowLeft") goTo(SES.i-1); else if(e.key==="ArrowRight") goTo(SES.i+1);
});
render();
})();
</script>
